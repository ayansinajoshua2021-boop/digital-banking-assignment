services:
  postgres:
    image: postgres:16
    container_name: digital-banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_banking
    ports:
      - "5432:5432"
    volumes:
      - banking_pgdata:/var/lib/postgresql/data

volumes:
  banking_pgdata:
